[project]
name = "capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kaushik-Calsoft", email = "inapuri.kaushik@calsoftinc.com" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "greenlet>=3.5.6",
    "pydantic[email,mail]>=2.14.4",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
capstone = "capstone:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
